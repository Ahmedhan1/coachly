# The installed app (static PWA). Its address must never change: trainers' data is tied to this origin.
# Deploy: `npm run deploy` in the repo root (builds, checks, then `wrangler deploy` uploads only changed files).
name = "pt-coach"
main = "src/index.ts"
compatibility_date = "2026-08-01"
# The app is served from workers.dev; no preview URLs needed.
preview_urls = false

# Workers Static Assets (free): files are served from Cloudflare's edge cache without running the Worker.
# Headers and cache rules: dist/_headers (generated from shared/appHeaders.ts by vite.config.ts).
[assets]
directory = "../../dist"
binding = "ASSETS"
# Client-side routes (/clients, /more/settings, ...) get index.html.
not_found_handling = "single-page-application"
# Only the branded icon routes run the Worker (they read D1).
run_worker_first = ["/api/brand", "/b/*"]

[[d1_databases]]
binding = "APP"
database_name = "pt-coach-app"
database_id = "477aa926-49b7-4bb0-964b-bc5879286839"

[observability]
enabled = true
head_sampling_rate = 0.1
