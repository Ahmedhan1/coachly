# Cloudflare Worker for PT Coach: trainer accounts (better-auth), cloud backup, Web Push, client page. Free tier
# only: Workers + D1 + R2 + one Cron Trigger. Owner guides (Arabic): ../docs/ACCOUNTS.md, ../docs/CLOUD.md
name = "api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
# better-auth uses node:async_hooks (AsyncLocalStorage). Free; part of the Workers runtime.
compatibility_flags = ["nodejs_compat"]
# Free: runs the Worker near the D1 database, so requests with several queries (sign-in, backup) are faster.
[placement]
mode = "smart"

[vars]
# Address of the installed app (the `pt-coach` Worker, deploy/app). Several origins may be separated by commas.
APP_ORIGIN = "https://app.getcoachly.workers.dev"
# This Worker's own public address (better-auth builds Google's callback URL from it).
BETTER_AUTH_URL = "https://api.getcoachly.workers.dev"
# Google sign-in: the OAuth client id from Google Cloud Console (not secret). Empty = Google button hidden/off.
# Authorised redirect URI there: <BETTER_AUTH_URL>/api/auth/callback/google
GOOGLE_CLIENT_ID = ""
# Cloud backup cap per trainer, bytes (100 MiB). docs/LIMITS.md explains the R2 budget.
BACKUP_MAX_BYTES = "104857600"
# Above this total (9 GiB of the 10 GB free R2), uploads that would grow storage get `storage_full`.
STORAGE_GUARD_BYTES = "9663676416"
# Cloud files (client/trainer photos, thumbnails, invoices, PDFs) are stored in the R2 bucket below, under files/.
# Encrypted on the phone before upload. They share the free 10 GB with backups (STORAGE_GUARD_BYTES covers both).
# Optional: to use an S3-compatible service instead (e.g. iDrive e2), add FILES_ENDPOINT, FILES_REGION, FILES_BUCKET
# vars and the two FILES_* secrets below.
# Cloud-file cap per trainer account, bytes (1 GiB).
FILES_ACCOUNT_MAX_BYTES = "1073741824"

# Secrets (never in this file) - set with `npx wrangler secret put NAME`:
#   BETTER_AUTH_SECRET   random text, at least 32 characters (e.g. `openssl rand -base64 32`). Changing it signs
#                        every trainer out of the cloud (the app keeps working offline).
#   ADMIN_PASSWORD       password for /admin (at least 12 characters)
#   GOOGLE_CLIENT_SECRET Google OAuth client secret (Google sign-in is off until it and GOOGLE_CLIENT_ID exist)
#   VAPID_PRIVATE_KEY    Web Push private key from `npm run vapid:keys` (push is off until all three VAPID_* exist)
#   VAPID_PUBLIC_KEY     Web Push public key from `npm run vapid:keys`
#   VAPID_SUBJECT        contact for push services, e.g. mailto:you@example.com
#   FILES_ACCESS_KEY_ID      optional: S3-compatible files store instead of R2 (with FILES_SECRET_ACCESS_KEY)
#   FILES_SECRET_ACCESS_KEY

[[d1_databases]]
binding = "DB"
database_name = "pt-coach-licenses"
database_id = "902382d0-8155-4203-89be-bae9c3f9d908"
migrations_dir = "migrations"

# Encrypted cloud backups, client pages and check-ins. Create once: npx wrangler r2 bucket create pt-coach-backups
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "pt-coach-backups"

# One cron (the Free plan allows 5 per account): sends due Web Push notifications every minute.
[triggers]
crons = ["* * * * *"]

[observability]
enabled = true
head_sampling_rate = 0.1
