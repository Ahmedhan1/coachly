# Auto-deploy of the account Worker (api.getcoachly…: accounts, client pages, push, backups) on every push to main.
# Every check runs first, then the D1 migrations and the Worker (`npm run deploy -- --worker-only`).
# The app itself (app.getcoachly…) is deployed by Cloudflare Workers Builds from the root wrangler.jsonc.
# Needs the repository secret CLOUDFLARE_API_TOKEN (Settings → Secrets and variables → Actions), and
# CLOUDFLARE_ACCOUNT_ID too if the token can see more than one Cloudflare account.
name: Deploy API

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one instead of racing it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Install Worker dependencies
        run: npm ci
        working-directory: worker

      - name: Check and deploy the account Worker
        run: npm run deploy -- --worker-only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: '1'
